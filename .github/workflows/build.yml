name: 📊 증인 기록 자동 정리

on:
  push:
    branches: [main]
    paths:
      - "records/**"
      - "scripts/**"
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      - name: 증인 기록 · 대시보드 정리
        run: python3 scripts/journal.py build
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "📊 증인 기록 자동 정리"
          git pull --rebase
          git push
